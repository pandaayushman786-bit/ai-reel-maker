<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Reel Maker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033
}

header{
background:linear-gradient(135deg,#111827,#2563eb);
color:white;
padding:35px 20px;
text-align:center
}

header h1{
margin:0 0 8px;
font-size:34px
}

header p{
margin:0;
opacity:.85
}

.container{
max-width:1100px;
margin:30px auto;
padding:0 18px
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.07)
}

label{
display:block;
font-weight:bold;
margin-bottom:8px
}

input,select{
width:100%;
padding:14px;
border:1px solid #d7dce5;
border-radius:10px;
font-size:16px;
margin-bottom:15px
}

button{
border:0;
border-radius:10px;
padding:13px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin:5px
}

.primary{
background:#2563eb;
color:white
}

.secondary{
background:#e8eefc;
color:#1e40af
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.progress{
height:10px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:15px
}

.progressBar{
height:100%;
width:0%;
background:#2563eb;
transition:width .2s
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px
}

.scene{
border:1px solid #e2e8f0;
border-radius:14px;
padding:16px;
background:#fafcff
}

.scene h3{
margin-top:0;
color:#2563eb
}

#preview{
width:270px;
max-width:100%;
display:block;
margin:auto;
background:#111;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.25)
}

.status{
padding:12px;
border-radius:10px;
background:#f1f5f9;
margin-top:12px
}

.success{
background:#dcfce7;
color:#166534
}

.small{
color:#64748b;
font-size:13px
}
</style>
</head>

<body>

<header>
<h1>🎬 AI Reel Maker</h1>
<p>Stage 7.1 • Captions + Music Studio</p>
</header>

<div class="container">

<div class="card">

<h2>Create Your Reel</h2>

<label>What should your reel be about?</label>

<input
id="topic"
placeholder="Example: 5 interesting facts about India"
>

<label>Reel length</label>

<select id="duration">
<option value="30">30 seconds</option>
<option value="45" selected>45 seconds</option>
<option value="60">60 seconds</option>
</select>

<label>Content style</label>

<select id="style">
<option value="viral">Fast & Viral</option>
<option value="news">News Style</option>
<option value="education">Educational</option>
<option value="cinematic">Cinematic</option>
</select>

<label>Voice style</label>

<select id="voiceStyle">
<option>Energetic</option>
<option>Professional</option>
<option>Calm</option>
<option>Dramatic</option>
</select>

<button class="primary" onclick="generateReel()">
✨ Generate Stage 7.1 Reel
</button>

<div class="progress">
<div class="progressBar" id="generationBar"></div>
</div>

<div class="status" id="generationStatus">
Ready to create your reel.
</div>

</div>


<div class="card" id="resultCard" style="display:none">

<h2>🔥 AI Hook</h2>
<p id="hook"></p>

<h2>🎙️ Voiceover Script</h2>
<p id="script"></p>

<button class="secondary" onclick="speakScript()">
🔊 Play Voice
</button>

</div>


<div class="card" id="sceneCard" style="display:none">

<h2>🎬 Scene Planner</h2>

<div class="grid" id="scenes"></div>

</div>


<div class="card" id="videoCard" style="display:none">

<h2>📱 Reel Preview</h2>

<canvas id="preview" width="540" height="960"></canvas>

<br>

<button class="secondary" onclick="startPreview()">
▶️ Preview Reel
</button>

<button class="primary" id="renderButton" onclick="renderReel()">
🎥 Render & Download Reel
</button>

<div class="status" id="renderStatus">
Ready to render.
</div>

<div class="progress">
<div class="progressBar" id="renderBar"></div>
</div>

<p class="small">
Stage 7.1 • Animated captions + background music • 30/45/60 seconds
</p>

</div>


<div class="card" id="captionCard" style="display:none">

<h2>📝 Caption</h2>
<p id="caption"></p>

<h2>#️⃣ Hashtags</h2>
<p id="hashtags"></p>

</div>

</div>


<script>

let currentPlan=null;
let animationTimer=null;


/* =========================
   SMART HOOK
========================= */

function makeHook(topic,style){

const lower=topic.toLowerCase();

if(lower.includes("india")){
return "Stop scrolling! These facts about India might actually surprise you.";
}

if(lower.includes("space")){
return "You probably don't know these surprising facts about space.";
}

if(style==="news"){
return "Here's what you need to know about this story.";
}

if(style==="education"){
return "Before you scroll, here's something worth learning.";
}

if(style==="cinematic"){
return "One story. Six moments. And details you probably never noticed.";
}

return "Stop scrolling! Here's something interesting you should know.";
}


/* =========================
   SCENES
========================= */

function makeScenes(topic){

const lower=topic.toLowerCase();

if(lower.includes("india")){

return [
"India is one of the world's most diverse countries.",
"India has one of the world's largest railway networks.",
"The Himalayas form a natural northern boundary.",
"India has hundreds of languages and dialects.",
"India has one of the world's largest film industries.",
"India's history spans thousands of years."
];

}

if(lower.includes("space")){

return [
"Space is almost completely silent.",
"A day on Venus is longer than its year.",
"Neutron stars are incredibly dense.",
"There are billions of galaxies in the observable universe.",
"Some stars are much larger than our Sun.",
"Space exploration continues to reveal new mysteries."
];

}

return [
"This topic has more interesting details than most people realize.",
"One important fact is often overlooked.",
"Another surprising detail changes the way we see the topic.",
"Experts continue to study this subject.",
"There are several real-world examples worth knowing.",
"And that's why this topic is worth exploring."
];

}


/* =========================
   GENERATE
========================= */

function generateReel(){

const topic=document.getElementById("topic").value.trim();
const style=document.getElementById("style").value;
const duration=Number(document.getElementById("duration").value);

if(!topic){
alert("Please enter a reel topic.");
return;
}

const bar=document.getElementById("generationBar");
const status=document.getElementById("generationStatus");

bar.style.width="10%";
status.textContent="Creating your hook...";

setTimeout(()=>{

bar.style.width="30%";
status.textContent="Writing your voiceover...";

},300);

setTimeout(()=>{

bar.style.width="55%";
status.textContent="Planning scenes...";

},600);

setTimeout(()=>{

const hook=makeHook(topic,style);
const sceneList=makeScenes(topic);

const script=
hook+" "+
sceneList.join(" ")+
" Follow for more.";

currentPlan={
topic:topic,
hook:hook,
script:script,
scenes:sceneList,
duration:duration
};

document.getElementById("hook").textContent=hook;
document.getElementById("script").textContent=script;

const scenesBox=document.getElementById("scenes");

scenesBox.innerHTML="";

sceneList.forEach((text,index)=>{

const div=document.createElement("div");

div.className="scene";

div.innerHTML=`
<h3>Scene ${index+1}</h3>
<p>${text}</p>
<p class="small">Visual concept: ${topic}</p>
`;

scenesBox.appendChild(div);

});

document.getElementById("caption").textContent=
hook+" #India #Facts #InterestingFacts #Reels";

document.getElementById("hashtags").textContent=
"#India #Facts #InterestingFacts #Knowledge #Reels #Viral";

document.getElementById("resultCard").style.display="block";
document.getElementById("sceneCard").style.display="block";
document.getElementById("videoCard").style.display="block";
document.getElementById("captionCard").style.display="block";

bar.style.width="100%";

status.textContent=
"Reel generated successfully! "+
duration+
"-second reel selected.";

status.className="status success";

drawScene(0,0);

},900);

}


/* =========================
   CANVAS
========================= */

const canvas=document.getElementById("preview");
const ctx=canvas.getContext("2d");


function drawScene(index,progress){

if(!currentPlan)return;

const scene=currentPlan.scenes[index];

const hue=(index*55)%360;

const gradient=ctx.createLinearGradient(
0,0,canvas.width,canvas.height
);

gradient.addColorStop(
0,
`hsl(${hue},75%,25%)`
);

gradient.addColorStop(
1,
`hsl(${(hue+70)%360},80%,45%)`
);

ctx.fillStyle=gradient;

ctx.fillRect(
0,0,canvas.width,canvas.height
);


/* Decorative circles */

ctx.globalAlpha=.18;
ctx.fillStyle="white";

ctx.beginPath();

ctx.arc(
100+progress*80,
170,
120,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
440-progress*70,
760,
170,
0,
Math.PI*2
);

ctx.fill();

ctx.globalAlpha=1;


/* Scene number */

ctx.fillStyle="white";

ctx.font="bold 28px Arial";

ctx.fillText(
`SCENE ${index+1}`,
40,
75
);


/* Topic */

ctx.font="bold 25px Arial";

wrapText(
currentPlan.topic,
40,
150,
460,
35
);


/* Main scene text */

ctx.font="bold 38px Arial";

wrapText(
scene,
40,
380,
460,
52
);


/* Animated caption */

const captionProgress=progress;

const captionY=
760+
Math.sin(captionProgress*Math.PI)*-25;

ctx.fillStyle="rgba(0,0,0,.65)";

roundRect(
35,
captionY-55,
470,
120,
22
);

ctx.fill();

ctx.fillStyle="white";

ctx.font="bold 27px Arial";

wrapText(
scene,
60,
captionY-5,
420,
38
);


/* Caption highlight line */

ctx.fillStyle="rgba(255,255,255,.75)";

ctx.fillRect(
60,
captionY+55,
420*progress,
6
);


/* Duration */

ctx.font="bold 20px Arial";

ctx.fillStyle="white";

ctx.fillText(
`${currentPlan.duration}s`,
40,
860
);


/* Bottom progress */

ctx.fillStyle="rgba(255,255,255,.3)";

ctx.fillRect(
40,
900,
460,
8
);

ctx.fillStyle="white";

ctx.fillRect(
40,
900,
460*progress,
8
);

}


/* =========================
   ROUNDED RECTANGLE
========================= */

function roundRect(x,y,w,h,r){

ctx.beginPath();

ctx.moveTo(x+r,y);

ctx.lineTo(x+w-r,y);

ctx.quadraticCurveTo(
x+w,y,
x+w,y+r
);

ctx.lineTo(x+w,y+h-r);

ctx.quadraticCurveTo(
x+w,y+h,
x+w-r,y+h
);

ctx.lineTo(x+r,y+h);

ctx.quadraticCurveTo(
x,y+h,
x,y+h-r
);

ctx.lineTo(x,y+r);

ctx.quadraticCurveTo(
x,y,
x+r,y
);

ctx.closePath();

}


/* =========================
   TEXT WRAP
========================= */

function wrapText(
text,x,y,maxWidth,lineHeight
){

const words=text.split(" ");

let line="";
let yy=y;

for(let i=0;i<words.length;i++){

const test=line+words[i]+" ";

const width=ctx.measureText(test).width;

if(width>maxWidth && i>0){

ctx.fillText(line,x,yy);

line=words[i]+" ";

yy+=lineHeight;

}else{

line=test;

}

}

ctx.fillText(line,x,yy);

}


/* =========================
   PREVIEW
========================= */

function startPreview(){

if(!currentPlan){

alert("Generate a reel first.");
return;

}

if(animationTimer){

clearInterval(animationTimer);

}

let frame=0;

const fps=30;

const previewSeconds=
Math.min(
currentPlan.duration,
15
);

const totalFrames=
previewSeconds*fps;

const framesPerScene=
totalFrames/
currentPlan.scenes.length;

animationTimer=setInterval(()=>{

const sceneIndex=
Math.min(
currentPlan.scenes.length-1,
Math.floor(frame/framesPerScene)
);

const localFrame=
frame%framesPerScene;

const progress=
localFrame/framesPerScene;

drawScene(
sceneIndex,
progress
);

frame++;

if(frame>=totalFrames){

clearInterval(animationTimer);

animationTimer=null;

}

},33);

}


/* =========================
   BROWSER VOICE
========================= */

function speakScript(){

if(!currentPlan)return;

if(!("speechSynthesis" in window)){

alert("Speech synthesis is not supported.");

return;

}

speechSynthesis.cancel();

const utterance=
new SpeechSynthesisUtterance(
currentPlan.script
);

const voiceStyle=
document.getElementById("voiceStyle").value;

if(voiceStyle==="Energetic"){
utterance.rate=1.08;
utterance.pitch=1.1;
}

if(voiceStyle==="Professional"){
utterance.rate=.95;
utterance.pitch=1;
}

if(voiceStyle==="Calm"){
utterance.rate=.85;
utterance.pitch=.9;
}

if(voiceStyle==="Dramatic"){
utterance.rate=.9;
utterance.pitch=.8;
}

speechSynthesis.speak(utterance);

}


/* =========================
   MIME TYPE
========================= */

function getMimeType(){

const types=[
"video/webm;codecs=vp8",
"video/webm",
""
];

for(const type of types){

if(
type==="" ||
MediaRecorder.isTypeSupported(type)
){

return type;

}

}

return "";

}


/* =========================
   BACKGROUND MUSIC
========================= */

function createMusic(){

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext){

return null;

}

const audioCtx=
new AudioContext();

const destination=
audioCtx.createMediaStreamDestination();

const master=
audioCtx.createGain();

master.gain.value=.055;

master.connect(destination);

master.connect(audioCtx.destination);


/* Soft repeating synth music */

const notes=[
261.63,
329.63,
392.00,
329.63,
293.66,
349.23,
440.00,
349.23
];

let stopped=false;

const startTime=
audioCtx.currentTime;

function playNote(index){

if(stopped)return;

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.type="sine";

osc.frequency.value=
notes[index%notes.length];

gain.gain.setValueAtTime(
0,
audioCtx.currentTime
);

gain.gain.linearRampToValueAtTime(
.7,
audioCtx.currentTime+.05
);

gain.gain.linearRampToValueAtTime(
0,
audioCtx.currentTime+.45
);

osc.connect(gain);
gain.connect(master);

osc.start();

osc.stop(
audioCtx.currentTime+.5
);

setTimeout(
()=>playNote(index+1),
500
);

}

playNote(0);

return {
stream:destination.stream,
stop:function(){

stopped=true;

audioCtx.close();

}
};

}


/* =========================
   RENDER REEL
========================= */

function renderReel(){

if(!currentPlan){

alert("Generate a reel first.");
return;

}

if(!window.MediaRecorder){

alert(
"Your browser does not support video recording."
);

return;

}

if(!canvas.captureStream){

alert(
"Your browser does not support canvas video."
);

return;

}

const button=
document.getElementById("renderButton");

const status=
document.getElementById("renderStatus");

const bar=
document.getElementById("renderBar");

button.disabled=true;

button.textContent="⏳ Rendering...";

status.className="status";

status.textContent=
`Preparing ${currentPlan.duration}-second video...`;

bar.style.width="0%";


if(animationTimer){

clearInterval(animationTimer);

animationTimer=null;

}


/* Canvas video */

const canvasStream=
canvas.captureStream(30);


/* Music audio */

let music=null;

try{

music=createMusic();

}catch(error){

music=null;

}


/* Combine video + music */

let combinedStream;

if(
music &&
music.stream
){

combinedStream=
new MediaStream([
...canvasStream.getVideoTracks(),
...music.stream.getAudioTracks()
]);

}else{

combinedStream=
canvasStream;

}


/* Recorder */

const mime=
getMimeType();

let recorder;

try{

recorder=
mime
?new MediaRecorder(
combinedStream,
{mimeType:mime}
)
:new MediaRecorder(
combinedStream
);

}catch(error){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Could not start video recorder.";

canvasStream.getTracks().forEach(
track=>track.stop()
);

if(music)music.stop();

return;

}


const chunks=[];


recorder.ondataavailable=
function(event){

if(
event.data &&
event.data.size>0
){

chunks.push(event.data);

}

};


recorder.onerror=function(){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Video recording failed. Please try again.";

canvasStream.getTracks().forEach(
track=>track.stop()
);

if(music)music.stop();

};


recorder.onstop=function(){

canvasStream.getTracks().forEach(
track=>track.stop()
);

if(music){

music.stop();

}


if(chunks.length===0){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"No video data was produced.";

return;

}


const blob=
new Blob(
chunks,
{
type:
recorder.mimeType||
"video/webm"
}
);


const url=
URL.createObjectURL(blob);


const link=
document.createElement("a");

link.href=url;

link.download=
`ai-reel-stage-7-1-${currentPlan.duration}s.webm`;

document.body.appendChild(link);

link.click();

link.remove();


setTimeout(()=>{

URL.revokeObjectURL(url);

},3000);


bar.style.width="100%";

status.className="status success";

status.textContent=
`✅ ${currentPlan.duration}-second reel downloaded with animated captions and background music!`;

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

};


/* First frame */

drawScene(0,0);


/* Start recorder */

try{

recorder.start(1000);

}catch(error){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Could not start recording.";

canvasStream.getTracks().forEach(
track=>track.stop()
);

if(music)music.stop();

return;

}


/* Duration */

const duration=
currentPlan.duration*1000;

const start=
performance.now();


function renderFrame(){

const elapsed=
performance.now()-start;

const sceneDuration=
duration/
currentPlan.scenes.length;

const sceneIndex=
Math.min(
currentPlan.scenes.length-1,
Math.floor(
elapsed/sceneDuration
)
);

const local=
elapsed%sceneDuration;

const progress=
local/sceneDuration;


drawScene(
sceneIndex,
progress
);


const percent=
Math.min(
100,
Math.floor(
elapsed/duration*100
)
);


bar.style.width=
percent+"%";

status.textContent=
`Rendering ${currentPlan.duration}-second reel... ${percent}%`;


if(elapsed<duration){

requestAnimationFrame(
renderFrame
);

}

}


requestAnimationFrame(
renderFrame
);


/* Finish */

setTimeout(()=>{

if(
recorder.state==="recording"
){

status.textContent=
"Finishing video...";

recorder.stop();

}

},duration+1000);

}

</script>

</body>
</html>
