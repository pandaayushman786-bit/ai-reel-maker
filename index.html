<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>AI Reel Maker</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f4f7fb;
color:#172033
}

header{
background:linear-gradient(135deg,#020617,#1d4ed8,#7c3aed);
color:white;
padding:35px 20px;
text-align:center
}

header h1{
margin:0 0 8px;
font-size:34px
}

header p{
margin:0;
opacity:.85
}

.container{
max-width:1100px;
margin:30px auto;
padding:0 18px
}

.card{
background:white;
border-radius:18px;
padding:22px;
margin-bottom:20px;
box-shadow:0 8px 25px rgba(0,0,0,.07)
}

label{
display:block;
font-weight:bold;
margin-bottom:8px
}

input,select{
width:100%;
padding:14px;
border:1px solid #d7dce5;
border-radius:10px;
font-size:16px;
margin-bottom:15px
}

button{
border:0;
border-radius:10px;
padding:13px 18px;
font-size:15px;
font-weight:bold;
cursor:pointer;
margin:5px
}

.primary{
background:#2563eb;
color:white
}

.secondary{
background:#e8eefc;
color:#1e40af
}

button:disabled{
opacity:.55;
cursor:not-allowed
}

.progress{
height:10px;
background:#e5e7eb;
border-radius:20px;
overflow:hidden;
margin-top:15px
}

.progressBar{
height:100%;
width:0%;
background:#2563eb;
transition:width .2s
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:15px
}

.scene{
border:1px solid #e2e8f0;
border-radius:14px;
padding:16px;
background:#fafcff
}

.scene h3{
margin-top:0;
color:#2563eb
}

#preview{
width:270px;
max-width:100%;
display:block;
margin:auto;
background:#050505;
border-radius:20px;
box-shadow:0 12px 35px rgba(0,0,0,.25)
}

.status{
padding:12px;
border-radius:10px;
background:#f1f5f9;
margin-top:12px
}

.success{
background:#dcfce7;
color:#166534
}

.small{
color:#64748b;
font-size:13px
}
</style>
</head>

<body>

<header>
<h1>🎬 AI Reel Maker</h1>
<p>Stage 7.3 • Cinematic Visual Engine</p>
</header>

<div class="container">

<div class="card">

<h2>Create Your Reel</h2>

<label>What should your reel be about?</label>

<input
id="topic"
placeholder="Example: 5 interesting facts about India"
>

<label>Reel length</label>

<select id="duration">
<option value="30">30 seconds</option>
<option value="45" selected>45 seconds</option>
<option value="60">60 seconds</option>
</select>

<label>Content style</label>

<select id="style">
<option value="viral">Fast & Viral</option>
<option value="news">News Style</option>
<option value="education">Educational</option>
<option value="cinematic">Cinematic</option>
</select>

<label>Voice style</label>

<select id="voiceStyle">
<option>Energetic</option>
<option>Professional</option>
<option>Calm</option>
<option>Dramatic</option>
</select>

<button class="primary" onclick="generateReel()">
✨ Generate Stage 7.3 Reel
</button>

<div class="progress">
<div class="progressBar" id="generationBar"></div>
</div>

<div class="status" id="generationStatus">
Ready to create your reel.
</div>

</div>


<div class="card" id="resultCard" style="display:none">

<h2>🔥 AI Hook</h2>
<p id="hook"></p>

<h2>🎙️ Voiceover Script</h2>
<p id="script"></p>

<button class="secondary" onclick="speakScript()">
🔊 Play Voice
</button>

</div>


<div class="card" id="sceneCard" style="display:none">

<h2>🎬 Visual Scene Planner</h2>

<div class="grid" id="scenes"></div>

</div>


<div class="card" id="videoCard" style="display:none">

<h2>📱 Reel Preview</h2>

<canvas id="preview" width="540" height="960"></canvas>

<br>

<button class="secondary" onclick="startPreview()">
▶️ Preview Reel
</button>

<button class="primary" id="renderButton" onclick="renderReel()">
🎥 Render & Download Reel
</button>

<div class="status" id="renderStatus">
Ready to render.
</div>

<div class="progress">
<div class="progressBar" id="renderBar"></div>
</div>

<p class="small">
Stage 7.3 • Cinematic artwork + animated captions + music • 30/45/60 seconds
</p>

</div>


<div class="card" id="captionCard" style="display:none">

<h2>📝 Caption</h2>
<p id="caption"></p>

<h2>#️⃣ Hashtags</h2>
<p id="hashtags"></p>

</div>

</div>


<script>

let currentPlan=null;
let animationTimer=null;

const canvas=
document.getElementById("preview");

const ctx=
canvas.getContext("2d");


/* =========================
SMART HOOK
========================= */

function makeHook(topic,style){

const lower=
topic.toLowerCase();

if(lower.includes("india")){
return "Stop scrolling! These facts about India might actually surprise you.";
}

if(lower.includes("space")){
return "You probably don't know these surprising facts about space.";
}

if(style==="news"){
return "Here's what you need to know about this story.";
}

if(style==="education"){
return "Before you scroll, here's something worth learning.";
}

if(style==="cinematic"){
return "One story. Six moments. And details you probably never noticed.";
}

return "Stop scrolling! Here's something interesting you should know.";

}


/* =========================
SCENES
========================= */

function makeScenes(topic){

const lower=
topic.toLowerCase();

if(lower.includes("india")){

return [

"India is one of the world's most diverse countries.",

"India has one of the world's largest railway networks.",

"The Himalayas form a natural northern boundary.",

"India has hundreds of languages and dialects.",

"India has one of the world's largest film industries.",

"India's history spans thousands of years."

];

}


if(lower.includes("space")){

return [

"Space is almost completely silent.",

"A day on Venus is longer than its year.",

"Neutron stars are incredibly dense.",

"There are billions of galaxies in the observable universe.",

"Some stars are much larger than our Sun.",

"Space exploration continues to reveal new mysteries."

];

}


return [

"This topic has more interesting details than most people realize.",

"One important fact is often overlooked.",

"Another surprising detail changes the way we see the topic.",

"Experts continue to study this subject.",

"There are several real-world examples worth knowing.",

"And that's why this topic is worth exploring."

];

}


/* =========================
VISUAL THEMES
========================= */

function getTheme(topic,index){

const lower=
topic.toLowerCase();

if(lower.includes("india")){

return [

"india",
"railway",
"mountains",
"culture",
"cinema",
"history"

][index];

}

if(lower.includes("space")){

return [

"earth",
"venus",
"neutron",
"galaxy",
"star",
"rocket"

][index];

}

return [

"city",
"technology",
"world",
"nature",
"science",
"future"

][index];

}


/* =========================
GRADIENTS
========================= */

function getColors(theme){

const colors={

india:["#ff9933","#ffffff","#138808"],

railway:["#07111f","#1d4ed8","#38bdf8"],

mountains:["#0f172a","#475569","#bae6fd"],

culture:["#581c87","#db2777","#f59e0b"],

cinema:["#111827","#7f1d1d","#f59e0b"],

history:["#292524","#92400e","#fbbf24"],

earth:["#020617","#0369a1","#22d3ee"],

venus:["#451a03","#c2410c","#fbbf24"],

neutron:["#020617","#312e81","#818cf8"],

galaxy:["#020617","#4c1d95","#c084fc"],

star:["#172554","#f59e0b","#fff7ed"],

rocket:["#020617","#334155","#ef4444"],

city:["#020617","#1e3a8a","#38bdf8"],

technology:["#082f49","#0e7490","#22d3ee"],

world:["#052e16","#15803d","#4ade80"],

nature:["#052e16","#166534","#bef264"],

science:["#111827","#3730a3","#60a5fa"],

future:["#020617","#581c87","#22d3ee"]

};

return colors[theme]||
["#020617","#1d4ed8","#7c3aed"];

}


/* =========================
CINEMATIC ART
========================= */

function drawArtwork(theme,progress){

const colors=
getColors(theme);


/* Main gradient */

const gradient=
ctx.createLinearGradient(
0,
0,
canvas.width,
canvas.height
);

gradient.addColorStop(
0,
colors[0]
);

gradient.addColorStop(
.5,
colors[1]
);

gradient.addColorStop(
1,
colors[2]
);

ctx.fillStyle=
gradient;

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);


/* Moving light */

const lightX=
270+
Math.sin(progress*Math.PI*2)*220;

const lightY=
300+
Math.cos(progress*Math.PI)*180;

const glow=
ctx.createRadialGradient(
lightX,
lightY,
20,
lightX,
lightY,
430
);

glow.addColorStop(
0,
"rgba(255,255,255,.3)"
);

glow.addColorStop(
.4,
"rgba(255,255,255,.08)"
);

glow.addColorStop(
1,
"rgba(255,255,255,0)"
);

ctx.fillStyle=
glow;

ctx.fillRect(
0,
0,
540,
960
);


/* Large cinematic shapes */

ctx.globalAlpha=.12;

ctx.fillStyle="white";

const scale=
1+
progress*.35;

ctx.save();

ctx.translate(
270,
330
);

ctx.scale(
scale,
scale
);

ctx.beginPath();

ctx.arc(
0,
0,
190,
0,
Math.PI*2
);

ctx.fill();

ctx.restore();


ctx.globalAlpha=.1;

ctx.beginPath();

ctx.moveTo(0,700);
ctx.lineTo(540,300);
ctx.lineTo(540,960);
ctx.lineTo(0,960);
ctx.closePath();

ctx.fill();

ctx.globalAlpha=1;


/* Theme artwork */

drawThemeObject(
theme,
progress
);

}


/* =========================
THEME OBJECTS
========================= */

function drawThemeObject(theme,progress){

ctx.save();

const zoom=
1+
Math.sin(progress*Math.PI)*.08;

ctx.translate(
270,
360
);

ctx.scale(
zoom,
zoom
);

ctx.textAlign="center";
ctx.textBaseline="middle";


if(theme==="india"){

drawIndiaMap();

}

else if(theme==="railway"){

drawRailway();

}

else if(theme==="mountains"){

drawMountains();

}

else if(theme==="culture"){

drawGlobe();

}

else if(theme==="cinema"){

drawCinema();

}

else if(theme==="history"){

drawHistory();

}

else if(theme==="earth"){

drawPlanet("#38bdf8");

}

else if(theme==="venus"){

drawPlanet("#f59e0b");

}

else if(theme==="neutron"){

drawStar();

}

else if(theme==="galaxy"){

drawGalaxy();

}

else if(theme==="star"){

drawStar();

}

else if(theme==="rocket"){

drawRocket();

}

else if(theme==="city"){

drawCity();

}

else if(theme==="technology"){

drawTechnology();

}

else if(theme==="world"){

drawGlobe();

}

else if(theme==="nature"){

drawNature();

}

else if(theme==="science"){

drawScience();

}

else if(theme==="future"){

drawFuture();

}

ctx.restore();

}


/* =========================
INDIA ART
========================= */

function drawIndiaMap(){

ctx.fillStyle="rgba(255,255,255,.9)";

ctx.beginPath();

ctx.moveTo(-65,-170);
ctx.lineTo(5,-145);
ctx.lineTo(65,-100);
ctx.lineTo(55,-40);
ctx.lineTo(80,20);
ctx.lineTo(45,75);
ctx.lineTo(20,145);
ctx.lineTo(-15,205);
ctx.lineTo(-50,150);
ctx.lineTo(-40,90);
ctx.lineTo(-75,35);
ctx.lineTo(-50,-25);
ctx.lineTo(-75,-80);
ctx.closePath();

ctx.fill();

ctx.fillStyle="#ff9933";

ctx.fillRect(
-65,
-25,
130,
18
);

ctx.fillStyle="#138808";

ctx.fillRect(
-65,
7,
130,
18
);

ctx.fillStyle="#2563eb";

ctx.beginPath();

ctx.arc(
0,
-8,
10,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
RAILWAY
========================= */

function drawRailway(){

ctx.strokeStyle="rgba(255,255,255,.85)";

ctx.lineWidth=14;

ctx.beginPath();

ctx.moveTo(-230,80);
ctx.lineTo(230,80);

ctx.stroke();

ctx.lineWidth=6;

ctx.beginPath();

ctx.moveTo(-230,115);
ctx.lineTo(230,115);

ctx.stroke();

ctx.fillStyle="#e5e7eb";

roundRect(
-160,
-110,
320,
150,
25
);

ctx.fill();

ctx.fillStyle="#2563eb";

ctx.fillRect(
-120,
-70,
70,
55
);

ctx.fillRect(
-20,
-70,
70,
55
);

ctx.fillStyle="#111827";

ctx.beginPath();

ctx.arc(
-95,
45,
25,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
95,
45,
25,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
MOUNTAINS
========================= */

function drawMountains(){

ctx.fillStyle="#e2e8f0";

ctx.beginPath();

ctx.moveTo(-270,120);

ctx.lineTo(-120,-150);

ctx.lineTo(0,80);

ctx.lineTo(120,-180);

ctx.lineTo(270,120);

ctx.closePath();

ctx.fill();

ctx.fillStyle="#94a3b8";

ctx.beginPath();

ctx.moveTo(-270,120);

ctx.lineTo(-60,-40);

ctx.lineTo(40,120);

ctx.closePath();

ctx.fill();

ctx.fillStyle="#475569";

ctx.beginPath();

ctx.moveTo(20,120);

ctx.lineTo(130,-100);

ctx.lineTo(270,120);

ctx.closePath();

ctx.fill();

}


/* =========================
GLOBE
========================= */

function drawGlobe(){

ctx.strokeStyle="rgba(255,255,255,.9)";

ctx.lineWidth=10;

ctx.beginPath();

ctx.arc(
0,
0,
145,
0,
Math.PI*2
);

ctx.stroke();

ctx.lineWidth=5;

ctx.beginPath();

ctx.ellipse(
0,
0,
70,
145,
0,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(-145,0);
ctx.lineTo(145,0);

ctx.stroke();

ctx.beginPath();

ctx.moveTo(-115,-75);
ctx.quadraticCurveTo(
0,
-20,
115,
-75
);

ctx.stroke();

}


/* =========================
CINEMA
========================= */

function drawCinema(){

ctx.fillStyle="#111827";

roundRect(
-170,
-120,
340,
240,
25
);

ctx.fill();

ctx.fillStyle="#f59e0b";

ctx.fillRect(
-125,
-75,
250,
150
);

ctx.fillStyle="#020617";

ctx.beginPath();

ctx.arc(
0,
0,
42,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
HISTORY
========================= */

function drawHistory(){

ctx.fillStyle="#f5f5f4";

roundRect(
-150,
-170,
300,
340,
12
);

ctx.fill();

ctx.fillStyle="#92400e";

ctx.font="bold 38px Georgia";

ctx.fillText(
"PAST",
0,
0
);

}


/* =========================
PLANET
========================= */

function drawPlanet(color){

ctx.fillStyle=color;

ctx.beginPath();

ctx.arc(
0,
0,
145,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle=
"rgba(255,255,255,.65)";

ctx.lineWidth=8;

ctx.beginPath();

ctx.ellipse(
0,
0,
190,
55,
-.25,
0,
Math.PI*2
);

ctx.stroke();

}


/* =========================
STAR
========================= */

function drawStar(){

ctx.fillStyle="#fbbf24";

ctx.beginPath();

for(let i=0;i<16;i++){

const angle=
i*Math.PI/8;

const radius=
i%2===0?150:65;

const x=
Math.cos(angle)*radius;

const y=
Math.sin(angle)*radius;

if(i===0){
ctx.moveTo(x,y);
}else{
ctx.lineTo(x,y);
}

}

ctx.closePath();

ctx.fill();

}


/* =========================
GALAXY
========================= */

function drawGalaxy(){

for(let i=0;i<80;i++){

const angle=
i*.45;

const radius=
i*2.4;

const x=
Math.cos(angle)*radius;

const y=
Math.sin(angle)*radius*.45;

ctx.fillStyle=
`rgba(255,255,255,${.25+i/140})`;

ctx.beginPath();

ctx.arc(
x,
y,
3,
0,
Math.PI*2
);

ctx.fill();

}

}


/* =========================
ROCKET
========================= */

function drawRocket(){

ctx.fillStyle="#e5e7eb";

roundRect(
-45,
-150,
90,
250,
40
);

ctx.fill();

ctx.fillStyle="#2563eb";

ctx.beginPath();

ctx.arc(
0,
-80,
22,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle="#ef4444";

ctx.beginPath();

ctx.moveTo(-25,100);
ctx.lineTo(0,180);
ctx.lineTo(25,100);
ctx.closePath();

ctx.fill();

}


/* =========================
CITY
========================= */

function drawCity(){

const buildings=[

[-190,40,70,180],
[-110,-40,80,220],
[-15,20,80,160],
[80,-80,85,260],
[180,10,70,170]

];

buildings.forEach(
b=>{

ctx.fillStyle=
"rgba(255,255,255,.85)";

ctx.fillRect(
b[0],
b[1],
b[2],
b[3]
);

ctx.fillStyle="#2563eb";

for(
let y=b[1]+25;
y<b[1]+b[3]-15;
y+=35
){

ctx.fillRect(
b[0]+15,
y,
12,
15
);

ctx.fillRect(
b[0]+40,
y,
12,
15
);

}

});

}


/* =========================
TECHNOLOGY
========================= */

function drawTechnology(){

ctx.strokeStyle="#67e8f9";

ctx.lineWidth=8;

ctx.beginPath();

ctx.arc(
0,
0,
130,
0,
Math.PI*2
);

ctx.stroke();

ctx.lineWidth=4;

for(
let i=0;
i<8;
i++
){

const angle=
i*Math.PI/4;

ctx.beginPath();

ctx.moveTo(
Math.cos(angle)*130,
Math.sin(angle)*130
);

ctx.lineTo(
Math.cos(angle)*190,
Math.sin(angle)*190
);

ctx.stroke();

}

ctx.fillStyle="#22d3ee";

ctx.beginPath();

ctx.arc(
0,
0,
55,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
NATURE
========================= */

function drawNature(){

ctx.fillStyle="#4ade80";

ctx.beginPath();

ctx.ellipse(
0,
0,
70,
150,
-.45,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle="#166534";

ctx.lineWidth=8;

ctx.beginPath();

ctx.moveTo(
-80,
160
);

ctx.quadraticCurveTo(
0,
0,
70,
-140
);

ctx.stroke();

}


/* =========================
SCIENCE
========================= */

function drawScience(){

ctx.strokeStyle="#60a5fa";

ctx.lineWidth=10;

ctx.beginPath();

ctx.arc(
0,
0,
120,
0,
Math.PI*2
);

ctx.stroke();

ctx.beginPath();

ctx.ellipse(
0,
0,
180,
65,
.5,
0,
Math.PI*2
);

ctx.stroke();

ctx.fillStyle="#dbeafe";

ctx.beginPath();

ctx.arc(
0,
0,
35,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
FUTURE
========================= */

function drawFuture(){

ctx.strokeStyle="#22d3ee";

ctx.lineWidth=8;

ctx.beginPath();

ctx.moveTo(
-140,
80
);

ctx.lineTo(
0,
-140
);

ctx.lineTo(
140,
80
);

ctx.closePath();

ctx.stroke();

ctx.fillStyle="#a5f3fc";

ctx.beginPath();

ctx.arc(
0,
-30,
35,
0,
Math.PI*2
);

ctx.fill();

}


/* =========================
ROUND RECT
========================= */

function roundRect(
x,y,w,h,r
){

ctx.beginPath();

ctx.moveTo(
x+r,
y
);

ctx.lineTo(
x+w-r,
y
);

ctx.quadraticCurveTo(
x+w,
y,
x+w,
y+r
);

ctx.lineTo(
x+w,
y+h-r
);

ctx.quadraticCurveTo(
x+w,
y+h,
x+w-r,
y+h
);

ctx.lineTo(
x+r,
y+h
);

ctx.quadraticCurveTo(
x,
y+h,
x,
y+h-r
);

ctx.lineTo(
x,
y+r
);

ctx.quadraticCurveTo(
x,
y,
x+r,
y
);

ctx.closePath();

}


/* =========================
TEXT WRAP
========================= */

function wrapText(
text,
x,
y,
maxWidth,
lineHeight
){

const words=
text.split(" ");

let line="";
let yy=y;

for(
let i=0;
i<words.length;
i++
){

const test=
line+
words[i]+
" ";

const width=
ctx.measureText(test)
.width;

if(
width>maxWidth &&
i>0
){

ctx.fillText(
line,
x,
yy
);

line=
words[i]+" ";

yy+=lineHeight;

}else{

line=test;

}

}

ctx.fillText(
line,
x,
yy
);

}


/* =========================
SCENE
========================= */

function drawScene(
index,
progress
){

if(!currentPlan)return;

const scene=
currentPlan.scenes[index];

const theme=
currentPlan.themes[index];

drawArtwork(
theme,
progress
);


/* cinematic dark overlay */

const overlay=
ctx.createLinearGradient(
0,
450,
0,
960
);

overlay.addColorStop(
0,
"rgba(0,0,0,0)"
);

overlay.addColorStop(
1,
"rgba(0,0,0,.88)"
);

ctx.fillStyle=
overlay;

ctx.fillRect(
0,
0,
540,
960
);


/* scene label */

ctx.fillStyle=
"rgba(255,255,255,.9)";

ctx.font=
"bold 23px Arial";

ctx.fillText(
`SCENE ${index+1}`,
38,
65
);

"bold 23px Arial";

currentPlan.topic,

115,
465,
31
);

735-

ctx.fillStyle=
"rgba(0,0,0,.78)";

roundRect(
28,

484,

22
);

"bold 31px Arial";

wrapText(
scene,
50,

435,
42
);

7

);

GENERATE
========================= */

document.getElementById(
"topic"
).value.trim();

const style=
document.getElementById(
"style"
).value;

Number(
document.getElementById(
"duration"
).value
);

"Please enter a reel topic."
);

}

const bar=
document.getElementById(
"generationBar"
);

const status=
document.getElementById(
"generationStatus"
);

bar.style.width="10%";

status.textContent=
"Creating hook...";


setTimeout(()=>{

bar.style.width="30%";

status.textContent=
"Writing voiceover...";

},300);


setTimeout(()=>{

bar.style.width="55%";

status.textContent=
"Creating cinematic artwork...";

},600);

makeHook(
topic,
style
);

makeScenes(
topic
);

scenes.map(
(_,index)=>
getTheme(topic,index)
);

const script=
hook+
" "+
scenes.join(" ")+
" Follow for more.";


currentPlan={

topic:topic,

hook:hook,

script:script,

scenes:scenes,

themes:themes,

duration:duration

};


document.getElementById(
"hook"
).textContent=hook;

document.getElementById(

);

const div=

);

</p>

).textContent=

" #India #Facts #Knowledge #Reels";


document.getElementById(
"hashtags"
).textContent=

document.getElementById(
"resultCard"
).style.display="block";

).style.display="block";

).style.display="block";

/* =========================
PREVIEW
========================= */

function startPreview(){

if(!currentPlan){

alert(
"Generate a reel first."
);

return;

}

if(animationTimer){

clearInterval(
animationTimer
);

}

let frame=0;

const fps=30;

const seconds=
Math.min(
currentPlan.duration,
15
);

const totalFrames=
seconds*fps;

const framesPerScene=
totalFrames/
currentPlan.scenes.length;


animationTimer=
setInterval(()=>{

const sceneIndex=
Math.min(
currentPlan.scenes.length-1,
Math.floor(
frame/
framesPerScene
)
);

const local=
frame%
framesPerScene;

const progress=
local/
framesPerScene;


drawScene(
sceneIndex,
progress
);

frame++;


if(
frame>=totalFrames
){

clearInterval(
animationTimer
);

animationTimer=null;

}

},33);

}


/* =========================
VOICE
========================= */

function speakScript(){

if(!currentPlan)return;

if(
!("speechSynthesis" in window)
){

alert(
"Speech synthesis is not supported."
);

return;

}

speechSynthesis.cancel();

const utterance=
new SpeechSynthesisUtterance(
currentPlan.script
);

const style=
document.getElementById(
"voiceStyle"
).value;


if(style==="Energetic"){

utterance.rate=1.08;
utterance.pitch=1.1;

}

if(style==="Professional"){

utterance.rate=.95;
utterance.pitch=1;

}

if(style==="Calm"){

utterance.rate=.85;
utterance.pitch=.9;

}

if(style==="Dramatic"){

utterance.rate=.9;
utterance.pitch=.8;

}

speechSynthesis.speak(
utterance
);

}


/* =========================
MUSIC
========================= */

function createMusic(){

const AudioContext=
window.AudioContext||
window.webkitAudioContext;

if(!AudioContext){

return null;

}

const audioCtx=
new AudioContext();

audioCtx.resume();

const destination=
audioCtx.createMediaStreamDestination();

const master=
audioCtx.createGain();

master.gain.value=.055;

master.connect(
destination
);

master.connect(
audioCtx.destination
);

const notes=[

261.63,
329.63,
392,
329.63,
293.66,
349.23,
440,
349.23

];

let stopped=false;


function playNote(index){

if(stopped)return;

const osc=
audioCtx.createOscillator();

const gain=
audioCtx.createGain();

osc.type="sine";

osc.frequency.value=
notes[
index%
notes.length
];

gain.gain.setValueAtTime(
0,
audioCtx.currentTime
);

gain.gain.linearRampToValueAtTime(
.7,
audioCtx.currentTime+.05
);

gain.gain.linearRampToValueAtTime(
0,
audioCtx.currentTime+.45
);

osc.connect(gain);

gain.connect(master);

osc.start();

osc.stop(
audioCtx.currentTime+.5
);

setTimeout(
()=>playNote(index+1),
500
);

}

playNote(0);


return{

stream:
destination.stream,

stop:function(){

stopped=true;

audioCtx.close();

}

};

}


/* =========================
MIME
========================= */

function getMimeType(){

const types=[

"video/webm;codecs=vp8",

"video/webm",

""

];

for(
const type of types
){

if(
type===""||
MediaRecorder.isTypeSupported(type)
){

return type;

}

}

return "";

}


/* =========================
RENDER
========================= */

function renderReel(){

if(!currentPlan){

alert(
"Generate a reel first."
);

return;

}

if(!window.MediaRecorder){

alert(
"Your browser does not support video recording."
);

return;

}

if(!canvas.captureStream){

alert(
"Your browser does not support canvas video."
);

return;

}


const button=
document.getElementById(
"renderButton"
);

const status=
document.getElementById(
"renderStatus"
);

const bar=
document.getElementById(
"renderBar"
);

button.disabled=true;

button.textContent=
"⏳ Rendering...";

status.className="status";

status.textContent=
`Preparing ${currentPlan.duration}-second reel...`;

bar.style.width="0%";


if(animationTimer){

clearInterval(
animationTimer
);

animationTimer=null;

}


const canvasStream=
canvas.captureStream(30);

let music=null;

try{

music=createMusic();

}catch(error){

music=null;

}


let combinedStream;

if(
music &&
music.stream
){

combinedStream=
new MediaStream([

...canvasStream
.getVideoTracks(),

...music.stream
.getAudioTracks()

]);

}else{

combinedStream=
canvasStream;

}


const mime=
getMimeType();

let recorder;

try{

recorder=
mime
?
new MediaRecorder(
combinedStream,
{mimeType:mime}
)
:
new MediaRecorder(
combinedStream
);

}catch(error){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Could not start recorder.";

canvasStream
.getTracks()
.forEach(
track=>track.stop()
);

if(music)music.stop();

return;

}


const chunks=[];


recorder.ondataavailable=
function(event){

if(
event.data &&
event.data.size>0
){

chunks.push(
event.data
);

}

};


recorder.onerror=
function(){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Video recording failed.";

canvasStream
.getTracks()
.forEach(
track=>track.stop()
);

if(music)music.stop();

};


recorder.onstop=
function(){

canvasStream
.getTracks()
.forEach(
track=>track.stop()
);

if(music){

music.stop();

}


if(chunks.length===0){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"No video data was produced.";

return;

}


const blob=
new Blob(
chunks,
{
type:
recorder.mimeType||
"video/webm"
}
);

const url=
URL.createObjectURL(blob);

const link=
document.createElement("a");

link.href=url;

link.download=
`ai-reel-stage-7-3-${currentPlan.duration}s.webm`;

document.body.appendChild(
link
);

link.click();

link.remove();


setTimeout(
()=>URL.revokeObjectURL(url),
3000
);


bar.style.width="100%";

status.className=
"status success";

status.textContent=
`✅ ${currentPlan.duration}-second cinematic reel downloaded!`;

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

};


/* Start */

drawScene(
0,
0
);


try{

recorder.start(1000);

}catch(error){

button.disabled=false;

button.textContent=
"🎥 Render & Download Reel";

status.textContent=
"Could not start recording.";

canvasStream
.getTracks()
.forEach(
track=>track.stop()
);

if(music)music.stop();

return;

}


const duration=
currentPlan.duration*1000;

const start=
performance.now();


function renderFrame(){

const elapsed=
performance.now()-start;

const sceneDuration=
duration/
currentPlan.scenes.length;

const sceneIndex=
Math.min(
currentPlan.scenes.length-1,
Math.floor(
elapsed/
sceneDuration
)
);

const local=
elapsed%
sceneDuration;

const progress=
local/
sceneDuration;


drawScene(
sceneIndex,
progress
);


const percent=
Math.min(
100,
Math.floor(
elapsed/
duration*
100
)
);

bar.style.width=
percent+"%";

status.textContent=
`Rendering Stage 7.3... ${percent}%`;


if(
elapsed<duration
){

requestAnimationFrame(
renderFrame
);

}

}

requestAnimationFrame(
renderFrame
);


setTimeout(()=>{

if(
recorder.state==="recording"
){

status.textContent=
"Finishing video...";

recorder.stop();

}

},
duration+1000
);

}
